# ASCII only: on Windows, Alembic reads this file with the system code page.
# See docs/STORAGE.md section 4. The database URL comes from DATABASE_URL (.env)
# or database.url in config/settings.yaml; rebuild-db runs "upgrade head" itself.
# Manual use: uv run alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
