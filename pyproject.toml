[project]
name = "market-risk"
version = "0.1.0"
description = "美股大盘风险评分：数据准备、机械计算与 prompt 生成（v2-M 与 v3-R1 并行）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "pandas-market-calendars>=4.4",
    "openpyxl>=3.1",
]

[project.scripts]
market-risk = "market_risk.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<1.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: 需要联网的测试，默认跳过；用 `uv run pytest -m network` 运行",
]

[tool.coverage.run]
source = ["market_risk"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "RUF"]
ignore = [
    "ANN401",  # 序列化等通用函数需要 Any
    "RUF001",  # 中文全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
