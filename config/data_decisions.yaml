# 已裁定日期表：数据异常日期的人工裁定（程序遇到已裁定的日期时按裁定处理，不再提示"需人工判断"）
#
# 字段：
#   date        日期
#   symbol      标的（与 symbols.yaml 的 symbol 相同，如 BAMLH0A0HYM2）
#   decision    exclude（排除该日观测，两个版本都不计入）/ keep（保留该日观测，不再提示）
#               / invalid（无效数据：数据源错误，TradingView 导入时排除该行，对该标的该日期的所有导出文件生效）
#   reason      理由
#   decided_on  裁定日期
#   correct     人工批准的价格修正：仅 data build 应用，不修改原始导出或接口缓存
#   corrected_value  修正后的不复权收盘价（正数，最多4位小数；仅 correct 必填）
#   evidence_source  证据来源（仅 correct 必填）
# 修正前整行及修正值保存在市场数据 manifest；历史修订检测比较修正前的来源原值。
# correct 条目须由负责人审阅 reports/price_dispute_review.md 后批准（2026-09-27 批准 3 条）。
#
# 2026-09-27 起债市休市日的 OAS 观测按统一规则处理（SPEC 5.6 第10条）：一律排除，自然月末例外（v2-M 计入，v3-R1 不计入）。
# 本表只用于规则无法覆盖或需要偏离规则的日期；表中裁定优先于规则。清单见 reports/holiday_calendar_audit.md 第三部分。

