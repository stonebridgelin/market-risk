# 阶段6 逐日历史回测配置（2026-09-27 负责人确认）。门槛与区间写在这里，不写死在代码中。
config_version: 1

# 回测起点：所有评分必需输入及其回看窗口都齐全的最早交易日。
# S5FI、S5TW 都有数值从 2008-08-04 起（S5TW 起于 2008-07-24，S5FI 起于 2008-08-04）；
# 基准日的 T−5 也须有广度读数，第一个满足的基准日为 2008-08-11。不因规则在某些情况下可省略 F5/W5 而提前。
start: 2008-08-11

# 数据区间：开发期、验证期、保留期。保留期不得用于设计或调参，只用于最终检验；
# 涉及结果标签或回调事件的输出，保留期默认不写出（--unlock-holdout 才写出，并记录解锁时间）。
periods:
  development: {start: 2008-08-11, end: 2016-12-31}
  validation: {start: 2017-01-01, end: 2022-12-31}
  holdout: {start: 2023-01-01}

# 多层级回调识别（ZigZag）：每个层级独立在全部历史上运行；门槛含等号。
zigzag_levels:
  SPX: ['0.05', '0.10', '0.20']
  QQQ: ['0.07', '0.10', '0.20']

# 回调分级按跌幅深度判定，左闭右开：[小回调起点, 10%) 小回调、[10%, 20%) 修正、≥20% 熊市
grades:
  SPX: {small: '0.05', correction: '0.10', bear: '0.20'}
  QQQ: {small: '0.07', correction: '0.10', bear: '0.20'}

# episode_windows.csv：高点前 N 个交易日至低点后 N 个交易日
episode_window_sessions: 20

# 广度早期"单值K线"阶段的结束日（含当天），见 reports/tradingview_data_quality.md
single_value_phase_end:
  S5FI: 2010-08-31
  S5TW: 2010-10-01

# 结果依赖数据源的争议价格（证据不足且有实质影响的日期）：标的、日期、另一来源的收盘价、说明。
# 第二部分结案时没有这类日期（10 个争议日期均无实质影响），列表为空。
source_dependent_prices: []
