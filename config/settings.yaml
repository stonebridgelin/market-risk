# market-risk 运行配置
# 注意：评分规则本身（门槛数值）写在 scoring/v2m.py、scoring/v3r1.py 中，按 SOP 第7节冻结，不在此处配置。

symbols:
  scored: [SPY, QQQ, RSP]      # 参与计分的 ETF
  reference: [HYG, LQD]        # 仅作参考

moving_averages: [5, 10, 20, 30, 50, 200]   # 简单均线周期，基于不复权 Close

prices:
  lookback_calendar_days: 420  # 基准日往前至少下载的自然日数

three_segment:
  # d1 候选范围为 T−20 至 T−2（SOP 7.2，2026-09-27 确定，不再设开关）；另一口径只作参考
  query_start_offset: 45       # 三环节查询起点 T−45（股票交易日）

oas:
  series: BAMLH0A0HYM2
  revision_check: true         # SPEC 5.6 第3条：历史修订比对（ALFRED 基准日版本 vs 当前版本）
  # SPEC 6.3 / TRADINGVIEW 6.2：FRED 取不到的早期日期是否用 TradingView 导出数据补充（none / tradingview）
  # 开启前必须先运行 tv compare --symbol BAMLH0A0HYM2，由用户决定
  # 2026-09-27 开启：tv compare 在 2023-09-26 至 2026-09-24 的787天重叠区间0处不一致
  long_history_source: tradingview

vix:
  series: VIXCLS
  # SPEC 5.6 第7条：FRED 缺失时的官方备用源
  cboe_history_url: https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv

treasury:
  fallback_series: DGS10       # 主源失败时的备用源

database:
  # SQLAlchemy 连接地址；.env 的 DATABASE_URL 优先。SQLite 相对路径以存储根目录为基准（STORAGE 第4节）
  url: sqlite:///db/market_risk.sqlite

storage:
  # 存储根目录（相对路径以项目根目录为基准）。具体路径统一由 storage/paths.py 生成，见 docs/STORAGE.md
  root: .

network:
  max_retries: 3               # 网络失败重试次数（指数退避）
  backoff_seconds: 1.0

# SPEC 第7节：贴近门槛的读数
near_threshold:
  close_vs_ma_pct: 1.0         # 收盘价与 MA20/MA50 差距 ±1%
  ma5_vs_ma50_pct: 0.5         # MA5 与 MA50 差距 ±0.5%
  breadth_pts: 2.0             # F、W、L 与 40、50 差距 ±2 个百分点
  vix_pts: 1.0                 # VIX 与 18、20、25 差距 ±1
  vix_change_pts: 3.0          # g 与 20%、30% 差距 ±3 个百分点
  oas_bp: 3                    # ΔOAS 与 5、20 差距 ±3bp
  yield_bp: 2                  # y 与 H 差距 2bp 以内
